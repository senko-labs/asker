# Builds Asker.exe. On a version tag (v*), also publishes a GitHub release with it.
# Run manually (Actions > release > Run workflow) to only build and check the exe.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: dotnet publish Asker.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist

      - name: Upload unsigned exe
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: Asker-unsigned
          path: dist/Asker.exe

      # After SignPath Foundation approval: add the SIGNPATH_API_TOKEN secret, fill in the ids,
      # uncomment this step, and change the release step below to publish signed/Asker.exe.
      # - name: Sign with SignPath
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: <organization id>
      #     project-slug: asker
      #     signing-policy-slug: release-signing
      #     github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
      #     wait-for-completion: true
      #     output-artifact-directory: signed

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/Asker.exe --title "Asker ${{ github.ref_name }}" --generate-notes
